[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131c31"
textColor = "#e2e8f0"
font = "sans serif"

[server]
showEmailPrompt = false

[browser]
gatherUsageStats = false

[global]
# Range sliders pass value= (so Streamlit knows they have two handles) while session state holds the live value.
disableWidgetStateDuplicationWarning = true
